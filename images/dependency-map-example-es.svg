  <text x="46" y="300" fill="#19394B">En rojo: depende del teléfono principal o de su número. Sin resaltar: acceso independiente.</text>
  <g fill="#19394B">
    <text x="22" y="324" font-weight="600">Qué muestra el mapa</text>
    <text x="22" y="342">La pérdida del teléfono principal o de su número interrumpe tres vías a la vez: el acceso al banco, el segundo factor del alojamiento</text>
    <text x="22" y="358">y el restablecimiento del correo del que dependen ambos. Conviene resolver primero este punto único de fallo.</text>
    <text x="22" y="376" font-size="10">Medidas: códigos de recuperación en la tarjeta de emergencia, otro dispositivo de confianza con sesión iniciada y un PIN de la cuenta del operador.</text>
  </g>
