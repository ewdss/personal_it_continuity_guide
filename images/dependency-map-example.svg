  <text x="46" y="300" fill="#19394B">Red: depends on the main phone or its number. Plain boxes: independent.</text>
  <g fill="#19394B">
    <text x="22" y="324" font-weight="600">What the map shows</text>
    <text x="22" y="342">Losing the main phone or its number breaks all three chains at once: the bank sign-in, the second factor for hosting, and the</text>
    <text x="22" y="358">email reset behind both. That shared point is the single point of failure to fix first.</text>
    <text x="22" y="376">Fixes: recovery codes on the emergency card, a second trusted device already signed in, and a carrier-account PIN.</text>
